<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat del curso</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 20px auto; padding: 0 16px; }
    #mensajes { border: 1px solid #ccc; height: 400px; overflow-y: auto; padding: 10px; margin-bottom: 10px; }
    .msg { margin: 4px 0; }
    .hora { color: #888; font-size: 0.85em; }
    form { display: flex; gap: 8px; }
    #texto { flex: 1; padding: 8px; }
    button { padding: 8px 16px; }
  </style>
</head>
<body>
  <h1>Chat del curso</h1>
  <div id="mensajes"></div>
  <form id="formulario">
    <input id="texto" placeholder="Escribe un mensaje..." autocomplete="off">
    <button type="submit">Enviar</button>
  </form>

  <script>
    const URL = "https://ipcyuxydqrgxcehblnwx.supabase.co";
    const KEY = "sb_publishable_UZXa5xfq6LHxNX-3oahEOA_dch4-m0s";
    const db = supabase.createClient(URL, KEY);

    let nombre = "";
    while (!nombre) {
      nombre = (prompt("Tu nombre:") || "").trim().slice(0, 30);
    }

    const caja = document.getElementById("mensajes");
    let ultimoId = 0;

    function mostrar(m) {
      const hora = new Date(m.created_at).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
      const div = document.createElement("div");
      div.className = "msg";
      div.innerHTML = `<span class="hora">[${hora}]</span> <b></b>: <span></span>`;
      div.querySelector("b").textContent = m.autor;
      div.querySelectorAll("span")[1].textContent = m.texto;
      caja.appendChild(div);
      caja.scrollTop = caja.scrollHeight;
      ultimoId = Math.max(ultimoId, m.id);
    }

    async function cargarHistorial() {
      const { data } = await db.from("mensajes").select("*").order("id", { ascending: false }).limit(20);
      (data || []).reverse().forEach(mostrar);
    }

    async function revisarNuevos() {
      const { data } = await db.from("mensajes").select("*").gt("id", ultimoId).order("id");
      (data || []).forEach(mostrar);
    }

    document.getElementById("formulario").addEventListener("submit", async (e) => {
      e.preventDefault();
      const input = document.getElementById("texto");
      const texto = input.value.trim().slice(0, 500);
      if (!texto) return;
      input.value = "";
      await db.from("mensajes").insert({ autor: nombre, texto: texto });
      revisarNuevos();
    });

    cargarHistorial();
    setInterval(revisarNuevos, 2000);
  </script>
</body>
</html>
